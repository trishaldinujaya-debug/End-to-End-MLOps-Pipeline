name: MLOps CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc

      - name: Configure DVC credentials
        run: |
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user "${{ secrets.DAGSHUB_USER }}"
          dvc remote modify dagshub --local password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull DVC data
        run: |
          dvc pull

      - name: Build production model pipeline
        run: |
          python -m src.build_pipeline

      - name: Run tests
        run: |
          python -m pytest -v