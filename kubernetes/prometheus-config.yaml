apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "customer-churn-api"
        metrics_path: /metrics/
        static_configs:
          - targets:
              - customer-churn-api-service:8000